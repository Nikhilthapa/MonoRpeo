auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h  # Index rotation period (24h is recommended)

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
  filesystem:
    directory: /loki/chunks

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

limits_config:
  volume_enabled: true
  retention_period: 72h  # 3 days retention
  reject_old_samples: true
  reject_old_samples_max_age: 72h  # 3 days
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_query_length: 0h
  max_query_parallelism: 32
  max_streams_per_user: 10000
  max_line_size: 256KB
  allow_structured_metadata: false  # Disable structured metadata (requires tsdb + v13)

chunk_store_config:
  # Chunk store configuration - retention handled by limits_config and table_manager

table_manager:
  retention_deletes_enabled: true
  retention_period: 72h  # 3 days

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

frontend:
  max_outstanding_per_tenant: 2048
  compress_responses: true

querier:
  # Query configuration - max_query_lookback handled by limits_config.max_query_length

