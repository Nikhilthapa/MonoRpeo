global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: sparix-cluster
    environment: production

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - /etc/prometheus/rules.yml

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # Node Exporter - collect from all nodes using Docker service discovery
  - job_name: node-exporter
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: [com.docker.swarm.service.name=logging_node-exporter]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: instance
      - source_labels: [__meta_docker_container_label_com_docker_swarm_node_id]
        target_label: node_id
      - source_labels: [__address__]
        regex: ([^:]+):(\d+)
        target_label: __address__
        replacement: ${1}:9100

  # cAdvisor - container metrics
  - job_name: cadvisor
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: [com.docker.swarm.service.name=logging_cadvisor]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: instance
      - source_labels: [__meta_docker_container_label_com_docker_swarm_node_id]
        target_label: node_id
      - source_labels: [__address__]
        regex: ([^:]+):(\d+)
        target_label: __address__
        replacement: ${1}:8080

  # Docker Swarm services - if your services expose metrics endpoints
  - job_name: docker-services
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: label
            values: [com.docker.swarm.service.name]
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_swarm_service_name]
        target_label: service
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container
      # Only scrape if service has metrics port label
      - source_labels: [__meta_docker_container_label_metrics_port]
        regex: (.+)
        target_label: __address__
        replacement: ${1}:${__meta_docker_container_label_metrics_port}

