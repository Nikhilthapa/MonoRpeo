apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://logging_loki:3100
    isDefault: false
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: loki
          matcherRegex: traceID=(\\w+)
          name: TraceID
          url: $${__value.raw}

  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://logging_prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s
      queryTimeout: 60s
      httpMethod: POST

