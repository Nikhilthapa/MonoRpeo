version: '3.8'

services:
  # ============================================================================
  # IDENTITY DATABASE - Identity & Access Management
  # ============================================================================
  postgres-identity:
    image: postgres:15
    container_name: postgres-identity-db
    volumes:
      - postgres-identity-data:/var/lib/postgresql/data
      - ./config/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./config/postgres/pg_hba.conf:/var/lib/postgresql/data/pg_hba.conf
    ports:
      - ${POSTGRES_IDENTITY_PORT:-5433}:5432
    env_file: ../../.env.docker
    environment:
      - POSTGRES_INITDB_ARGS=--auth-host=md5
      - POSTGRES_DB=${IDENTITY_DB_NAME:-identity_db}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-prisma}
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
      update_config:
        parallelism: 1
        order: start-first
        delay: 10s
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0
      rollback_config:
        parallelism: 1
        order: stop-first
        delay: 10s
    networks:
      - hirenova-network
      - agent_network
    healthcheck:
      test: [CMD-SHELL, pg_isready -U ${DB_USER:-postgres} -d ${IDENTITY_DB_NAME:-identity_db}]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pgbouncer-identity:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer-identity
    ports:
      - ${PGBOUNCER_IDENTITY_PORT:-6433}:6432
    env_file: ../../.env.docker
    environment:
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-prisma}
      - DB_HOST=postgres-identity
      - DB_NAME=${IDENTITY_DB_NAME:-identity_db}
    volumes:
      - ./config/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini
      - ./config/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
      update_config:
        parallelism: 1
        order: start-first
        delay: 10s
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0
      rollback_config:
        parallelism: 1
        order: stop-first
        delay: 10s
    networks:
      - hirenova-network
      - agent_network
    healthcheck:
      test: [CMD, pg_isready, -h, localhost, -p, "6432", -U, ${DB_USER:-postgres}]
