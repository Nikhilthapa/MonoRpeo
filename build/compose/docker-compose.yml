      - APP_PATH=dist/apps/backend/tenant-service/main.js
      - PORT=${TENANT_SERVICE_INTERNAL_PORT:-3004}
      - DATABASE_URL=${TENANT_DATABASE_URL}
      - TENANT_DATABASE_URL=${TENANT_DATABASE_URL}
