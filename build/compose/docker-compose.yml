version: '3.8'

services:
  # ============================================================================
  # API GATEWAY
  # ============================================================================
  api-gateway:
    image: placio33/hirenova:latest
    command: sh -c "node $${APP_PATH}"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        order: start-first
        delay: 10s
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0
      rollback_config:
        parallelism: 1
        order: stop-first
        delay: 10s
    ports:
      - ${API_GATEWAY_PORT:-3031}:${API_GATEWAY_INTERNAL_PORT:-3031}
    networks:
      - hirenova-network
      - agent_network
    volumes:
      - shared-storage:/shared
    environment:
      - NODE_ENV=production
      - APP_PATH=dist/apps/api-gateway/main.js
      - BULK_EMAIL_SERVICE_URL=http://bulk-email-service:${BULK_EMAIL_SERVICE_INTERNAL_PORT:-3045}
    env_file: ../../.env.docker

  # ============================================================================
  # BACKEND SERVICES
  # ============================================================================

  # --- Auth Service ---
  auth-service:
    image: placio33/hirenova:latest
    command: sh -c "node $${APP_PATH}"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
      update_config:
        parallelism: 1
        order: start-first
        delay: 10s
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0
      rollback_config:
        parallelism: 1
        order: stop-first
        delay: 10s
    ports:
      - ${AUTH_SERVICE_PORT:-3001}:${AUTH_SERVICE_INTERNAL_PORT:-3001}
    networks:
      - hirenova-network
      - agent_network
    volumes:
      - shared-storage:/shared
    environment:
      - NODE_ENV=production
      - APP_PATH=dist/apps/backend/auth-service/main.js
      - PORT=${AUTH_SERVICE_INTERNAL_PORT:-3001}
      - DATABASE_URL=${IDENTITY_DATABASE_URL}
      - IDENTITY_DATABASE_URL=${IDENTITY_DATABASE_URL}
    env_file: ../../.env.docker

  # --- Company Service ---
  company-service:
    image: placio33/hirenova:latest
    command: sh -c "node $${APP_PATH}"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
      update_config:
        parallelism: 1
        order: start-first
        delay: 10s
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0
      rollback_config:
        parallelism: 1
        order: stop-first
        delay: 10s
    ports:
      - ${COMPANY_SERVICE_PORT:-3002}:${COMPANY_SERVICE_INTERNAL_PORT:-3002}
    networks:
      - hirenova-network
      - agent_network
    volumes:
      - shared-storage:/shared
    environment:
      - NODE_ENV=production
      - APP_PATH=dist/apps/backend/company-service/main.js
      - PORT=${COMPANY_SERVICE_INTERNAL_PORT:-3002}
      - DATABASE_URL=${ORGANIZATION_DATABASE_URL}
      - ORGANIZATION_DATABASE_URL=${ORGANIZATION_DATABASE_URL}
    env_file: ../../.env.docker

  # --- Job Service ---
  job-service:
    image: placio33/hirenova:latest
    command: sh -c "node $${APP_PATH}"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
      update_config:
        parallelism: 1
        order: start-first
        delay: 10s
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0
      rollback_config:
        parallelism: 1
        order: stop-first
        delay: 10s
    ports:
