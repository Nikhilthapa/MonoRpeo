    volumes:
      - shared-storage:/shared
    environment:
      - NODE_ENV=production
      - APP_PATH=dist/apps/backend/search-service/main.js
      - PORT=${SEARCH_SERVICE_INTERNAL_PORT:-3006}
      - REDIS_URL=${REDIS_URL}
    env_file: ../../.env.docker

# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  shared-storage:
    driver: local
    driver_opts:
      type: nfs4
      o: addr=${NFS_MANAGER_IP:-},rw,noatime,rsize=8192,wsize=8192,tcp,timeo=14
      device: ":${SHARED_STORAGE_PATH:-/var/lib/hirenova/shared-storage}"

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  hirenova-network:
    driver: overlay
    attachable: true
  agent_network:
    external: true
