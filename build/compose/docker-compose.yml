  # --- Audit Service ---
  audit-service:
    image: placio33/hirenova:latest
    command: sh -c "node $${APP_PATH}"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
      update_config:
        parallelism: 1
        order: start-first
        delay: 10s
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0
      rollback_config:
        parallelism: 1
        order: stop-first
        delay: 10s
    ports:
      - ${AUDIT_SERVICE_PORT:-3005}:${AUDIT_SERVICE_INTERNAL_PORT:-3005}
    networks:
      - hirenova-network
      - agent_network
    volumes:
      - shared-storage:/shared
    environment:
      - NODE_ENV=production
      - APP_PATH=dist/apps/backend/audit-service/main.js
      - PORT=${AUDIT_SERVICE_INTERNAL_PORT:-3005}
      - DATABASE_URL=${AUDIT_DATABASE_URL}
      - AUDIT_DATABASE_URL=${AUDIT_DATABASE_URL}
    env_file: ../../.env.docker

  # --- Notification Service ---
  notification-service:
    image: placio33/hirenova:latest
    command: sh -c "node $${APP_PATH}"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      update_config:
        parallelism: 1
        order: start-first
        delay: 10s
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0
      rollback_config:
