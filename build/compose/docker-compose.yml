  # --- Search Service ---
  search-service:
    image: placio33/hirenova:latest
    command: sh -c "node $${APP_PATH}"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
